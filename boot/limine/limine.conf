# kilons 0.4.1 Limine configuration.
timeout: 5
default_entry: 1
graphics: yes
serial: yes
interface_branding: kilons 0.4.1

/kilons 0.4.1
    protocol: limine
    path: boot():/boot/kilons/kernel.elf
    module_path: boot():/boot/kilons/rootfs.kilofs
    module_string: rootfs

/Advanced options for kilons 0.4.1
